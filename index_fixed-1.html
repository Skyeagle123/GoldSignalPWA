<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoldSignals • الذهب</title>
  <style>
    body{background:#0e1420;color:#e7edf6;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:0}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    h1{font-weight:700;margin:8px 0 16px}
    .panel{background:#101a2b;border:1px solid #1c2940;border-radius:14px;padding:16px;margin:14px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{background:#24324d;border:1px solid #33476c;color:#e7edf6;padding:10px 14px;border-radius:12px;cursor:pointer}
    .btn:hover{background:#2a3a59}
    input[type="checkbox"]{width:18px;height:18px;vertical-align:middle}
    .pill{background:#16243a;border:1px solid #24324d;border-radius:999px;padding:8px 12px;margin-inline-end:8px;display:inline-flex;gap:8px;align-items:center}
    .toast-signal{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:24px;min-width:220px;background:#0b1a30cc;border:1px solid #1b386b;color:#dff2ff;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s ease}
    .toast-signal.show{opacity:1;transform:translate(-50%,-6px)}
    .muted{opacity:.7}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GoldSignals • الذهب</h1>

    <div class="panel" id="liveBox">
      <div class="row">
        <div class="pill">السعر الحي: <b id="livePrice">—</b></div>
        <div class="pill">الملخص: <b id="summary">—</b></div>
      </div>
    </div>

    <div class="panel" id="dataSettings">
      <h3 style="margin-top:0">إعدادات البيانات</h3>
      <div class="row muted">رابط CSV للأسعار (اختياري):
        <input id="csvUrl" placeholder="اتركه فارغًا لاستخدام XAUUSD_5min.csv" style="flex:1;min-width:260px;background:#0b1526;color:#e7edf6;border:1px solid #223457;border-radius:10px;padding:10px"></div>
      <div class="row">
        <label class="pill"><input type="radio" name="tf" value="5" checked> 5 دقائق</label>
        <label class="pill"><input type="radio" name="tf" value="30"> 30 دقيقة</label>
        <label class="pill"><input type="radio" name="tf" value="60"> ساعة</label>
        <label class="pill"><input type="radio" name="tf" value="1440"> يوم (NY)</label>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="csvInput" type="file" accept=".csv" style="display:none">
        <button id="importCsvBtn" class="btn">📥 استيراد CSV</button>
        <button id="exportCsvBtn" class="btn">💾 تنزيل CSV المدموج</button>
        <button id="testBeepBtn" class="btn">🔔 تجربة التنبيه</button>
      </div>
    </div>

    <div class="panel" id="signalsPanel">
      <h3 style="margin-top:0">إعدادات الإشارات والمؤشرات</h3>
      <div class="row">
        <label class="pill"><input id="sigUseRsi" type="checkbox" checked> RSI</label>
        <label class="pill"><input id="sigUseMacd" type="checkbox" checked> MACD</label>
        <label class="pill"><input id="sigUseEma" type="checkbox" checked> EMA</label>
        <label class="pill"><input id="sigUseBb"  type="checkbox"> BB</label>
        <label class="pill"><input id="sigUseStoch" type="checkbox"> Stoch</label>
      </div>
      <div class="row">
        <label class="pill"><input id="sigBeep" type="checkbox" checked> تنبيه: صوت</label>
        <label class="pill"><input id="sigToast" type="checkbox" checked> رسالة على الشاشة</label>
      </div>
      <div class="muted">* أشّر أعلاه لتمكين المؤشر ضمن قرار الإصدار. الرسم البياني يبقى مستقل.</div>
    </div>

    <div class="panel">
      <h3 style="margin-top:0">الرسم البياني (SL/TP/دخول/خروج)</h3>
      <div id="chart" style="height:360px;background:#0b1526;border:1px solid #223457;border-radius:10px"></div>
    </div>
  </div>

  <div id="signalToast" class="toast-signal" role="status" aria-live="polite"></div>
  <script src="app_fixed.js?v=1"></script>
</body>
</html>
