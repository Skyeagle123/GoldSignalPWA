
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Worker Check</title>
  <style>
    body{background:#0b1320;color:#fff;font:16px/1.5 sans-serif;padding:20px}
    .card{background:#121b2e;border-radius:12px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);margin-bottom:16px}
    .k{color:#9fc3ff}
    .v{font-weight:bold}
    .ok{color:#54d18c}
    .bad{color:#ff6b6b}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
  </style>
</head>
<body>
  <h2>اختبار بث السعر من الـ Worker</h2>
  <div class="card mono" id="box">…</div>

<script>
const WORKER = 'https://workerjs.samer-mourtada.workers.dev/price';

function num(x){ const n=Number(x); return Number.isFinite(n)?n:null; }
function fmt(v){ try{return (Math.round(v*100)/100).toFixed(2);}catch(_){return String(v);} }
function tsFmt(ms){ const d=new Date(ms); return d.toISOString().replace('T',' ').replace('Z',''); }

async function getWorker(){
  const url = WORKER + (WORKER.includes('?')?'&':'?') + 't=' + Date.now();
  const r = await fetch(url, { cache:'no-store', headers:{'cache-control':'no-cache, no-store','accept':'application/json'} });
  const ct = (r.headers.get('content-type')||'').toLowerCase();
  const txt = await r.text();
  try{
    if (ct.includes('json') || txt.trim().startsWith('{')){
      const j = JSON.parse(txt);
      return { ok:true, price:num(j.price ?? j.close), ts:(j.ts ?? Date.now()), raw:j };
    }
  }catch(_){}
  const m = txt.match(/[+-]?\d+(?:\.\d+)?/g);
  return { ok:true, price: m? num(m.pop()): null, ts: Date.now(), raw:txt };
}

async function tick(){
  let box = document.getElementById('box');
  try{
    const r = await getWorker();
    const now = Date.now();
    const age = Math.round((now - (r.ts||now))/1000);
    let html = '';
    html += '<div><span class="k">Worker:</span> ' + (r.ok ? '<span class="ok">OK</span>' : '<span class="bad">ERR</span>') + '</div>';
    html += '<div><span class="k">price:</span> <span class="v">' + (r.price!=null? fmt(r.price): 'null') + '</span></div>';
    html += '<div><span class="k">ts:</span> ' + tsFmt(r.ts||now) + '  <span class="'+(age<=3?'ok':'bad')+'">age '+age+'s</span></div>';
    html += '<div><span class="k">raw:</span> ' + (typeof r.raw==='string' ? r.raw.slice(0,120) : JSON.stringify(r.raw)) + '</div>';
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<span class="bad">Error: '+e+'</span>';
  }
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
