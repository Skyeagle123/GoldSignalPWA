<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoldSignals • الذهب</title>
  <style>
    :root{--bg:#0e1420;--card:#111a2c;--muted:#8aa4bf;--accent:#4ea8ff;--good:#10b981;--bad:#ef4444;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Kufi Arabic',Tahoma,Arial;background:var(--bg);color:#e6eef7}
    .container{max-width:980px;margin:16px auto;padding:0 12px}
    h1{font-size:28px;margin:8px 0 16px}
    .grid{display:grid;gap:12px}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.25)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .pill{background:#16243b;color:#cfe6ff;border:1px solid #1e3355;border-radius:999px;padding:10px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
    .pill svg{width:18px;height:18px;opacity:.85}
    .muted{color:var(--muted)}
    .title{font-size:18px;margin-bottom:12px}
    .value{font-size:36px;font-weight:700;letter-spacing:.5px}
    .good{color:var(--good)} .bad{color:var(--bad)}
    .btn{background:#1a2a46;border:1px solid #254067;color:#d7e8ff;border-radius:10px;padding:10px 14px;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    label{display:inline-flex;gap:6px;align-items:center;margin-inline-end:12px}
    input[type=radio],input[type=checkbox]{width:18px;height:18px}
    .toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:16px;background:#15263f;border:1px solid #254067;border-radius:12px;padding:10px 14px;color:#d7e8ff;box-shadow:0 8px 40px rgba(0,0,0,.35);display:none;z-index:9999}
    .sr{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
    .section-title{font-size:16px;margin:2px 0 10px;color:#b9d3f2}
    .divider{height:1px;background:#15263f;margin:12px 0}
    .note{font-size:12px;color:#96aecb}
    .mini{font-size:12px;color:#9fb6cf}
  </style>
</head>
<body>
  <div class="container grid">
    <h1>الذهب • <span class="muted">GoldSignals</span></h1>

    <div class="grid" style="grid-template-columns:1fr;gap:16px">
      <!-- Live price card -->
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div>
            <div class="section-title muted">السعر الحي</div>
            <div id="livePrice" class="value">—</div>
            <div id="liveStamp" class="mini">—</div>
          </div>
          <div>
            <div class="section-title muted">الملخّص</div>
            <div id="summaryText" class="value" style="font-size:28px">—</div>
          </div>
        </div>
      </div>

      <!-- Data settings -->
      <div class="card" id="dataCard">
        <div class="title">إعدادات البيانات</div>

        <div class="row">
          <input id="csvUrl" class="btn" style="flex:1;text-align:start" placeholder="اتركه فارغًا لاستخدام XAUUSD_5min.csv" />
        </div>

        <div class="divider"></div>

        <div class="row">
          <span class="muted">الإطار الزمني:</span>
          <label><input type="radio" name="tf" value="5" checked> 5 دقائق</label>
          <label><input type="radio" name="tf" value="30"> 30 دقيقة</label>
          <label><input type="radio" name="tf" value="60"> ساعة</label>
          <label><input type="radio" name="tf" value="1440"> يوم (NY)</label>
        </div>

        <div class="row">
          <label><input type="checkbox" id="precise"> وضع دقيق (Precise)</label>
          <label><input type="checkbox" id="mtf" checked> تأكيد متعدد الأطر (MTF)</label>
        </div>

        <div class="divider"></div>

        <!-- CSV buttons under data settings -->
        <div class="row">
          <input id="fileCsvInput" type="file" accept=".csv,text/csv" class="sr">
          <button id="importCsvBtn" class="pill" type="button" title="استيراد CSV">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="#9fd3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            CSV استيراد
          </button>
          <button id="exportCsvBtn" class="pill" type="button" title="تنزيل CSV مدموج">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9m0 0-4 4m4-4 4 4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2" stroke="#cde9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            تنزيل CSV المدموج
          </button>
          <button id="testBeepBtn" class="btn" type="button">تجربة التنبيه 🔔</button>
        </div>
        <div class="note">يتم دمج السعر الحي مع ملف CSV (إن وُجد) ويُحفّظ كملف متوافق مع Excel.</div>
      </div>

      <!-- Indicators & alerts -->
      <div class="card">
        <div class="title">إعدادات الإشارات والمؤشرات</div>
        <div class="row">
          <label><input type="checkbox" id="indEMA" checked> EMA</label>
          <label><input type="checkbox" id="indMACD" checked> MACD</label>
          <label><input type="checkbox" id="indRSI" checked> RSI</label>
          <label><input type="checkbox" id="indStoch"> Stoch</label>
          <label><input type="checkbox" id="indBB"> BB</label>
        </div>
        <div class="row">
          <label><input type="checkbox" id="alertSound" checked> التنبيه: صوت</label>
          <label><input type="checkbox" id="alertToast" checked> رسالة على الشاشة</label>
        </div>
      </div>

      <!-- Chart placeholder -->
      <div class="card">
        <div class="title">الرسم البياني (SL/TP/دخول/خروج)</div>
        <div style="height:260px;border:1px dashed #26476f;border-radius:10px;display:grid;place-items:center;color:#7fa7cd">
          (مكان الرسم البياني — تركناه كما هو كي لا نغيّر كودك الأساسي)
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">تم</div>

  <script src="app_final.js?v=1"></script>
</body>
</html>
