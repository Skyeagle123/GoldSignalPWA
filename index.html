<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoldSignals • الذهب</title>
  <style>
    :root { --bg:#0b1220; --panel:#121a2b; --text:#e5e7eb; --muted:#93a4b8; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444; --chip:#1f2a44; }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans",Tahoma,Ubuntu;}
    header{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg),#0b1220e6 55%,#0b122000);z-index:10;}
    .status{display:inline-block;padding:6px 12px;border-radius:999px;background:#25324c;color:#dbe2ee;font-weight:600;margin-inline-end:8px}
    .status.ok{background:var(--ok);color:#04120a}
    .status.warn{background:var(--warn);color:#1b1002}
    .status.bad{background:var(--bad);color:#230507}
    .panel{background:var(--panel);border-radius:18px;padding:16px;margin:14px;}
    h1{font-size:20px;margin:0;font-weight:700}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    input[type="text"]{background:#0e1728;border:1px solid #21314d;border-radius:12px;padding:10px 12px;color:var(--text);min-width:280px}
    button{background:#2b3a60;border:1px solid #3a4f7a;color:#e6eef9;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
    button.primary{background:#3656f5;border-color:#5e79ff}
    .chips{display:flex;gap:10px;flex-wrap:wrap}
    .chip{background:var(--chip);border:1px solid #2b3b60;border-radius:999px;padding:8px 12px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .kpi{font-size:40px;font-weight:800}
    canvas{width:100%;height:300px;background:#0e1627;border-radius:14px}
    table{width:100%;border-collapse:collapse}
    td,th{padding:8px 10px;border-bottom:1px solid #1e2944;color:#c9d4e7}
    .muted{color:var(--muted)}
    footer{height:40px}
  </style>
</head>
<body>
  <header>
    <span id="connStatus" class="status">الاتصال: —</span>
    <span id="csvAge" class="status">CSV: —</span>
    <h1>GoldSignals • الذهب</h1>
  </header>

  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <label class="muted">رابط CSV للأسعار (اختياري):</label>
        <input id="csvInput" type="text" placeholder="اتركه فاضي لاستخدام XAUUSD_5min.csv من نفس المجلد" />
      </div>
      <div class="row">
        <button id="tf5"  class="chip">5 دقائق</button>
        <button id="tf30" class="chip">30 دقيقة</button>
        <button id="tf60" class="chip">ساعة</button>
        <button id="tfD"  class="chip">يوم (NY)</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px;gap:10px">
      <button id="runBtn" class="primary">حساب الإشارات الآن</button>
      <button id="dlCsvBtn">تنزيل CSV المدموج</button>
    </div>
  </section>

  <section class="panel grid">
    <div>
      <div class="muted">السعر الحي</div>
      <div class="kpi" id="livePrice">—</div>
      <div class="muted" id="liveTime">—</div>
    </div>
    <div>
      <div class="muted">الملخّص:</div>
      <div id="summaryText">—</div>
    </div>
    <div>
      <div class="muted">المؤشرات</div>
      <div class="chips">
        <span class="chip">RSI: <b id="indRSI">—</b></span>
        <span class="chip">MACD: <b id="indMACD">—</b></span>
        <span class="chip">EMA سريع: <b id="indEMAF">—</b></span>
        <span class="chip">EMA بطيء: <b id="indEMAS">—</b></span>
      </div>
    </div>
  </section>

  <section class="panel">
    <h3>(SL/TP/دخول/خروج) الرسم البياني</h3>
    <canvas id="tradeChart"></canvas>
  </section>

  <section class="panel">
    <h3>آخر الشموع</h3>
    <table>
      <thead><tr><th>التاريخ</th><th>الوقت</th><th>الإغلاق</th><th>إشارة</th><th>RSI</th><th>MACD</th><th>EMA</th></tr></thead>
      <tbody id="rowsBody"></tbody>
    </table>
  </section>

  <footer></footer>

  <script src="./app.js"></script>
</body>
</html>
